[project]
name = "rag-system"
version = "0.1.0"
description = "Hybrid-retrieval RAG assistant for company policy documents, with an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "en-core-web-sm",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "spacy>=3.8.18",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# CPU-only torch on Linux (Docker, CI): avoids several GB of CUDA libraries.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
