name: RAG Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        # setup-uv publishes no floating major tags (e.g. v10) since v8; use a full version.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest -v --cov=. --cov-report=term-missing

      # Retrieval-only evaluation: no API calls, so no secrets are needed.
      # Generation and the decision judge run locally with --generation --judge.
      - name: Run RAG retrieval evaluation
        run: uv run python test/run_eval.py
